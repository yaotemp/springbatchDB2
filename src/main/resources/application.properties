# H2 数据源（Spring Batch 元数据）
spring.datasource.h2.url=jdbc:h2:file:./data/batch-metadata;DB_CLOSE_DELAY=-1
spring.datasource.h2.username=sa
spring.datasource.h2.password=
spring.datasource.h2.driver-class-name=org.h2.Driver

# MySQL 数据源（业务数据）
app.datasource.mysql.url=jdbc:mysql://localhost:3306/springbatch?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
app.datasource.mysql.username=root
app.datasource.mysql.password=admin
app.datasource.mysql.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Batch 元数据表初始化
spring.batch.jdbc.initialize-schema=always

# 禁用自动执行Job
spring.batch.job.enabled=false

# 输出文件路径
output.csv.path=./output/users_output.csv