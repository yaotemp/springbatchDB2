# H2 datasource (Spring Batch metadata)
spring.datasource.h2.url=jdbc:h2:file:./data/batch-metadata;DB_CLOSE_DELAY=-1
spring.datasource.h2.username=sa
spring.datasource.h2.password=
spring.datasource.h2.driver-class-name=org.h2.Driver

# z/OS DB2 datasource configuration
app.datasource.db2.url=jdbc:db2://your-zos-host:port/your-database
app.datasource.db2.username=your-db2-username
app.datasource.db2.password=your-db2-password
app.datasource.db2.driver-class-name=com.ibm.db2.jcc.DB2Driver
app.datasource.db2.schema=YOUR_SCHEMA

# z/OS DB2 connection properties
app.datasource.db2.hikari.connection-timeout=30000
app.datasource.db2.hikari.maximum-pool-size=10
app.datasource.db2.hikari.minimum-idle=2
app.datasource.db2.hikari.idle-timeout=600000
app.datasource.db2.hikari.max-lifetime=1800000

# EBCDIC encoding support (if needed)
app.datasource.db2.connection-properties=currentSchema=YOUR_SCHEMA;encoding=Cp1047

# Spring Batch metadata table initialization
spring.batch.jdbc.initialize-schema=always

# Disable automatic job execution
spring.batch.job.enabled=false

# Output file path
output.csv.path=./output/output.csv